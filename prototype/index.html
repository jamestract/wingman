<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Wingman Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05060f; --ink:#eef0ff; --dim:#8b90b8; --line:rgba(255,255,255,.12);
    --a:#7c5cff; --b:#ff5ca8; --c:#2fd6c3; --gold:#ffd27a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
  body{display:flex;justify-content:center;align-items:center}
  .phone{position:relative;width:100%;max-width:420px;height:100%;max-height:880px;background:radial-gradient(ellipse at 50% 30%,#141a3a 0%,#080a1c 55%,var(--bg) 100%);overflow:hidden;border-radius:0}
  @media(min-width:500px){.phone{border-radius:36px;border:1px solid #222;height:92vh}}
  canvas#stars{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .layer{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column}

  header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px}
  .logo{font-weight:700;letter-spacing:.5px;font-size:20px;display:flex;align-items:center;gap:8px}
  .logo i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--a));box-shadow:0 0 12px var(--a);display:inline-block}
  .me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}

  .modes{display:flex;margin:8px 20px 0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px}
  .modes button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:13px;font-weight:600;padding:9px 0;border-radius:999px;cursor:pointer;transition:.2s}
  .modes button.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;box-shadow:0 0 18px rgba(124,92,255,.5)}

  .view{flex:1;position:relative;display:none;flex-direction:column;min-height:0}
  .view.on{display:flex}

  /* wingman picker */
  .wing{padding:12px 20px 0;font-size:12px;color:var(--dim)}
  .chips{display:flex;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
  .chip.on{border-color:var(--c);box-shadow:0 0 12px rgba(47,214,195,.35)}

  /* planet avatar */
  .planet{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;position:relative;flex-shrink:0;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .planet.sm{width:26px;height:26px;font-size:11px}
  .planet.md{width:40px;height:40px;font-size:14px}

  /* orbit stage */
  .stage{flex:1;position:relative;min-height:0;touch-action:pan-y;cursor:grab}
  .system{position:absolute;inset:0;transition:transform .35s ease, opacity .35s ease}
  .ring{position:absolute;left:50%;top:46%;border:1px dashed rgba(255,255,255,.18);border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg)}
  .core{position:absolute;left:50%;top:46%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--gold);box-shadow:0 0 30px 8px rgba(255,210,122,.45)}
  .orbiter{position:absolute;left:50%;top:46%;width:0;height:0}
  .body{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;cursor:pointer;transition:filter .2s}
  .body .glow{position:absolute;inset:-14px;border-radius:50%;filter:blur(16px);opacity:.55}
  .body .ball{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset -18px -18px 40px rgba(0,0,0,.45), inset 10px 10px 30px rgba(255,255,255,.18)}
  .body .ini{font-size:38px;font-weight:700;line-height:1}
  .body .nm{font-size:13px;font-weight:600;margin-top:4px}
  .body .ag{font-size:11px;opacity:.85}
  .body .pick{position:absolute;top:-8px;right:-4px;background:var(--c);color:#04201c;font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;white-space:nowrap;box-shadow:0 0 12px rgba(47,214,195,.6)}

  .tether{position:absolute;inset:0;pointer-events:none}

  .meta{text-align:center;padding:0 24px}
  .meta h2{font-size:20px}
  .meta p{font-size:13px;color:var(--dim);margin-top:4px}
  .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:#cfd3f5;background:rgba(255,255,255,.04)}

  .actions{display:flex;justify-content:center;gap:22px;padding:16px 0 10px}
  .act{width:62px;height:62px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .act:active{transform:scale(.9)}
  .act.no{color:#ff7d7d}
  .act.yes{background:linear-gradient(135deg,var(--a),var(--b));border:0;box-shadow:0 0 24px rgba(255,92,168,.5);width:72px;height:72px;font-size:28px}
  .act.info{font-size:16px;color:var(--dim)}
  .stamp{position:absolute;top:18%;font-size:26px;font-weight:700;padding:6px 14px;border:3px solid;border-radius:10px;opacity:0;transform:rotate(-12deg);pointer-events:none;z-index:5;transition:opacity .1s}
  .stamp.like{left:24px;color:var(--c);border-color:var(--c)}
  .stamp.pass{right:24px;color:#ff7d7d;border-color:#ff7d7d;transform:rotate(12deg)}
  .counter{font-size:11px;color:var(--dim);text-align:center;padding-bottom:6px}

  /* individuals */
  .indiv{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
  .indiv::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px;position:relative}
  .solo{position:relative;width:200px;height:200px;margin:10px 0 18px}
  .solo .ball{position:absolute;inset:0;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset -24px -24px 50px rgba(0,0,0,.45), inset 12px 12px 34px rgba(255,255,255,.18)}
  .solo .ball .ini{font-size:56px;font-weight:700}
  .solo .glow{position:absolute;inset:-20px;border-radius:50%;filter:blur(24px);opacity:.5}
  .streak{position:absolute;top:50%;width:90px;height:40px;transform:translateY(-50%);pointer-events:none}
  .streak.l{right:100%;margin-right:4px}
  .streak.r{left:100%;margin-left:4px}
  .streak span{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6));animation:zip 1.6s linear infinite}
  .streak.l span{background:linear-gradient(270deg,transparent,rgba(255,255,255,.6))}
  @keyframes zip{0%{opacity:0;transform:translateX(-10px)}50%{opacity:1}100%{opacity:0;transform:translateX(10px)}}
  .moon{position:absolute;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;animation:moon 9s linear infinite;box-shadow:inset -8px -8px 14px rgba(0,0,0,.4)}
  @keyframes moon{from{transform:rotate(0deg) translateX(132px) rotate(0deg)}to{transform:rotate(360deg) translateX(132px) rotate(-360deg)}}
  .moonwrap{position:absolute;left:50%;top:50%;width:0;height:0}
  .moonwrap .moon{left:-26px;top:-26px}
  .ffcard{width:100%;margin-top:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:12px;color:var(--dim)}
  .ffrow{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--ink);font-size:13px}
  .ffrow .plus{color:var(--dim)}
  .dots{display:flex;justify-content:center;gap:6px;padding:4px 0}
  .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}
  .dots i.on{background:var(--b);box-shadow:0 0 8px var(--b)}

  /* dates */
  .dates{flex:1;overflow-y:auto;padding:14px 20px 20px}
  .empty{text-align:center;color:var(--dim);margin-top:60px;font-size:14px;line-height:1.6}
  .daterow{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.04);margin-bottom:10px;cursor:pointer}
  .quad{display:grid;grid-template-columns:repeat(2,22px);gap:3px}
  .daterow b{font-size:14px}
  .daterow small{display:block;color:var(--dim);font-size:12px;margin-top:2px}

  nav{display:flex;justify-content:space-around;padding:10px 0 18px;border-top:1px solid var(--line);background:rgba(5,6,15,.6);backdrop-filter:blur(8px)}
  nav button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
  nav button.on{color:#fff}
  nav button svg{width:22px;height:22px}
  .badge{position:absolute;top:-4px;right:2px;background:var(--b);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px}

  /* overlays */
  .overlay{position:absolute;inset:0;z-index:20;background:rgba(3,4,12,.82);backdrop-filter:blur(6px);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .overlay.on{display:flex;animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .converge{position:relative;width:260px;height:220px}
  .converge .planet{position:absolute;width:70px;height:70px;font-size:24px;box-shadow:inset -10px -10px 20px rgba(0,0,0,.4),0 0 24px rgba(255,255,255,.15);transition:all .9s cubic-bezier(.2,.9,.2,1.2)}
  .overlay h1{font-size:28px;background:linear-gradient(90deg,var(--c),var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
  .overlay p{color:var(--dim);font-size:14px;margin-top:8px;line-height:1.5}
  .steps{margin-top:16px;text-align:left;font-size:13px;width:100%;max-width:300px}
  .steps div{display:flex;gap:10px;align-items:center;padding:7px 0;opacity:0;transform:translateY(6px);transition:.4s}
  .steps div.in{opacity:1;transform:none}
  .steps .ck{width:20px;height:20px;border-radius:50%;background:var(--c);color:#04201c;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .btn{margin-top:20px;padding:13px 26px;border-radius:999px;border:0;font:inherit;font-weight:600;font-size:14px;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b));color:#fff}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);margin-top:10px}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:#0d1028;border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px;transform:translateY(100%);transition:transform .3s ease}
  .sheet.on{transform:none}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 14px}
  .sheet h3{font-size:18px}
  .sheet p{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5}
  .prompt{margin-top:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05);font-size:13px}
  .prompt small{color:var(--dim);display:block;margin-bottom:4px}
  .sheet .alt{margin-top:14px;font-size:12px;color:var(--c);cursor:pointer}

  /* chat */
  .chat{position:absolute;inset:0;z-index:25;background:var(--bg);display:none;flex-direction:column}
  .chat.on{display:flex}
  .chat header{border-bottom:1px solid var(--line);padding-bottom:12px}
  .back{background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer;padding-right:10px}
  .msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .sys{align-self:center;font-size:11px;color:var(--dim);background:rgba(255,255,255,.05);padding:6px 12px;border-radius:999px;text-align:center}
  .card{align-self:stretch;border:1px solid var(--line);border-radius:16px;padding:12px;background:linear-gradient(135deg,rgba(124,92,255,.15),rgba(255,92,168,.1));font-size:13px}
  .card b{display:block;font-size:15px;margin-bottom:4px}
  .m{max-width:78%;display:flex;gap:8px;align-items:flex-end}
  .m .bub{padding:9px 12px;border-radius:16px;background:rgba(255,255,255,.08);font-size:13px;line-height:1.4}
  .m.mine{align-self:flex-end;flex-direction:row-reverse}
  .m.mine .bub{background:linear-gradient(135deg,var(--a),var(--b))}
  .m .who{font-size:10px;color:var(--dim);margin-bottom:2px}
  .compose{display:flex;gap:8px;padding:12px 16px 20px;border-top:1px solid var(--line)}
  .compose input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:11px 14px;color:var(--ink);font:inherit;font-size:13px;outline:none}
  .compose button{background:linear-gradient(135deg,var(--a),var(--b));border:0;border-radius:50%;width:42px;height:42px;color:#fff;font-size:16px;cursor:pointer}

  .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim);pointer-events:none}
  .toast{position:absolute;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1a1f45;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:12px;z-index:30;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="stars"></canvas>
  <div class="layer">
    <header>
      <div class="logo"><i></i>wingman</div>
      <div class="me"><span>you</span><div class="planet sm" id="meAv"></div></div>
    </header>

    <!-- EXPLORE -->
    <div class="view on" id="v-explore">
      <div class="modes">
        <button class="on" data-mode="pairs">Pairs in orbit</button>
        <button data-mode="solo">Friends of friends</button>
      </div>

      <!-- pairs -->
      <div class="view on" id="m-pairs">
        <div class="wing">Flying with
          <div class="chips" id="wingChips"></div>
        </div>
        <div class="stage" id="stage">
          <div class="stamp like" id="stLike">ORBIT</div>
          <div class="stamp pass" id="stPass">DRIFT</div>
          <div class="system" id="system"></div>
          <div class="hint">tap a planet for their profile · drag to swipe</div>
        </div>
        <div class="meta" id="pairMeta"></div>
        <div class="actions">
          <button class="act no" id="noBtn" title="Pass">✕</button>
          <button class="act yes" id="yesBtn" title="Interested">♥</button>
          <button class="act info" id="swapBtn" title="See their friends">⟳</button>
        </div>
        <div class="counter" id="counter"></div>
      </div>

      <!-- individuals -->
      <div class="view" id="m-solo">
        <div class="indiv" id="indiv"></div>
        <div class="dots" id="dots"></div>
        <div class="actions" style="padding-top:8px">
          <button class="act no" id="soloNo">✕</button>
          <button class="act yes" id="soloYes">♥</button>
        </div>
      </div>
    </div>

    <!-- DATES -->
    <div class="view" id="v-dates">
      <div class="dates" id="dateList"></div>
    </div>

    <!-- CIRCLE -->
    <div class="view" id="v-circle">
      <div class="dates" id="circleView"></div>
    </div>

    <nav>
      <button class="on" data-tab="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/></svg>Universe</button>
      <button data-tab="dates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><circle cx="8" cy="17" r="3"/><circle cx="16" cy="17" r="3"/></svg>Double dates<span class="badge" id="badge"></span></button>
      <button data-tab="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="3" r="1.5"/><circle cx="20" cy="15" r="1.5"/><circle cx="5" cy="17" r="1.5"/></svg>My circle</button>
    </nav>
  </div>

  <!-- profile sheet -->
  <div class="sheet" id="sheet"></div>

  <!-- match overlay -->
  <div class="overlay" id="match">
    <div class="converge" id="converge"></div>
    <h1>Double date set</h1>
    <p id="matchSub"></p>
    <div class="steps" id="steps"></div>
    <button class="btn" id="openChat">Open group chat</button>
    <button class="btn ghost" id="keepSwiping">Keep exploring</button>
  </div>

  <!-- chat -->
  <div class="chat" id="chat">
    <header><div style="display:flex;align-items:center"><button class="back" id="chatBack">‹</button><div><div style="font-weight:600" id="chatTitle"></div><div style="font-size:11px;color:var(--dim)" id="chatSub"></div></div></div><div class="quad" id="chatQuad"></div></header>
    <div class="msgs" id="msgs"></div>
    <form class="compose" id="compose"><input id="msgIn" placeholder="Message the group…" autocomplete="off"><button>➤</button></form>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------- mock data ---------- */
const PAL=[["#7c5cff","#3a1fd1"],["#ff5ca8","#b8126a"],["#2fd6c3","#0e7f73"],["#ffb35c","#c4620c"],["#5cb8ff","#1a5fb8"],["#c95cff","#7417b0"],["#ff7d5c","#b8301a"],["#8cff5c","#3f9e12"],["#ffd27a","#b88a1a"],["#5cffd9","#10a383"]];
let pi=0;
const P=(name,age,school,bio,tags,prompt)=>({id:name.toLowerCase(),name,age,school,bio,tags,prompt,col:PAL[(pi++)%PAL.length]});

const ME=P("Spencer",22,"Michigan","","");
const MY_FRIENDS=[
  P("Jake",22,"Michigan","Will out-dance you.",["House music","Pickup bball"]),
  P("Leo",21,"Michigan","Brunch is a personality.",["Foodie","Golf"]),
  P("Dev",22,"Michigan","Plays the aux responsibly.",["Concerts","Poker"]),
];
const PEOPLE={};
[
  P("Ava",21,"Michigan","Ross junior. Will judge your coffee order.",["Coffee snob","Pilates","NYC summers"],["Perfect double date","Karaoke then late-night tacos"]),
  P("Mia",21,"Michigan","Ava's roommate. Louder than Ava.",["Karaoke","Taylor Swift","Skiing"],["Green flag","Knows the bartender"]),
  P("Sofia",22,"Michigan","Pre-med, still has time for you.",["Tennis","Sushi","Travel"],["Ideal night","Wine bar, then the Arb at night"]),
  P("Chloe",22,"Michigan","Art history and bad puns.",["Museums","Vinyl","Thrifting"],["Two truths & a lie","I've met Zendaya, I hate cats, I can juggle"]),
  P("Nina",20,"Michigan","Club volleyball captain.",["Volleyball","EDM","Hiking"],["Dealbreaker","Doesn't like dogs"]),
  P("Lily",21,"Michigan","Will plan the whole night.",["Planner","Cooking","Jazz"],["Best first date","Bowling, because nobody's good at it"]),
  P("Emma",21,"Michigan","Engineer who bakes.",["Baking","F1","Board games"],["Hot take","Pineapple belongs on pizza"]),
  P("Grace",22,"Michigan","Says yes to everything once.",["Spontaneous","Concerts","Beach"],["Looking for","A duo that matches our energy"]),
].forEach(p=>PEOPLE[p.id]=p);
// friend circles (their universes)
const CIRCLES={ava:["mia","lily"],mia:["ava","grace"],sofia:["chloe","emma"],chloe:["sofia","nina"],nina:["chloe","grace"],lily:["ava","emma"],emma:["sofia","lily"],grace:["mia","nina"]};

// pairs you swipe through; "pick" = which of your friends already liked whom
const PAIRS=[
  {a:"ava",b:"mia",pick:{friend:"jake",of:"mia"},spot:"Rick's · Fri 10pm"},
  {a:"sofia",b:"chloe",pick:null,spot:"Ashley's · Thu 9pm"},
  {a:"nina",b:"grace",pick:{friend:"dev",of:"grace"},spot:"Revelry · Sat 8pm"},
  {a:"lily",b:"emma",pick:{friend:"leo",of:"lily"},spot:"Bowling at Colonial Lanes · Sun 7pm"},
];
// individuals: friends of your friends' dates
const SOLO=["chloe","emma","grace","lily","sofia","nina"];

/* ---------- state ---------- */
let wingman="jake", pairIdx=0, soloIdx=0, dates=[], unseen=0;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const grad=c=>`radial-gradient(circle at 32% 28%, ${c[0]} 0%, ${c[1]} 70%, #0b0b20 115%)`;
const av=(p,cls="sm")=>`<div class="planet ${cls}" style="background:${grad(p.col)}">${p.name[0]}</div>`;
const who=id=>PEOPLE[id]||MY_FRIENDS.find(f=>f.id===id)||ME;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),1800)}
$("#meAv").outerHTML=av(ME);

/* ---------- starfield ---------- */
(function(){
  const c=$("#stars"),x=c.getContext("2d");let W,H,S=[];
  function size(){const r=c.parentElement.getBoundingClientRect();W=c.width=r.width*devicePixelRatio;H=c.height=r.height*devicePixelRatio;
    S=Array.from({length:180},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4*devicePixelRatio+.2,t:Math.random()*6,s:.2+Math.random()*.6}))}
  size();addEventListener("resize",size);
  let shoot=null;
  (function draw(){x.clearRect(0,0,W,H);
    for(const s of S){s.t+=.02;x.globalAlpha=.35+.65*Math.abs(Math.sin(s.t*s.s));x.fillStyle="#fff";x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}
    if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W,y:Math.random()*H*.4,l:0};
    if(shoot){shoot.l+=14*devicePixelRatio;const g=x.createLinearGradient(shoot.x,shoot.y,shoot.x+shoot.l,shoot.y+shoot.l*.4);g.addColorStop(0,"rgba(255,255,255,0)");g.addColorStop(1,"rgba(255,255,255,.8)");x.globalAlpha=1;x.strokeStyle=g;x.lineWidth=1.5*devicePixelRatio;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x+shoot.l,shoot.y+shoot.l*.4);x.stroke();if(shoot.l>260*devicePixelRatio)shoot=null}
    requestAnimationFrame(draw)})();
})();

/* ---------- wingman chips ---------- */
function renderChips(){
  $("#wingChips").innerHTML=MY_FRIENDS.map(f=>`<button class="chip ${f.id===wingman?"on":""}" data-f="${f.id}">${av(f)}${f.name}</button>`).join("")+`<button class="chip" data-f="auto">✦ Auto-pair</button>`;
  document.querySelectorAll("#wingChips .chip").forEach(b=>b.onclick=()=>{
    if(b.dataset.f==="auto"){const p=PAIRS[pairIdx%PAIRS.length];wingman=p.pick?p.pick.friend:MY_FRIENDS[0].id;toast("Auto-paired you with "+who(wingman).name)}
    else wingman=b.dataset.f;
    renderChips();renderPair();
  });
}

/* ---------- pairs orbit ---------- */
let angle=0, paused=false;
function renderPair(){
  const p=PAIRS[pairIdx%PAIRS.length], A=PEOPLE[p.a], B=PEOPLE[p.b];
  const pickTag=(id)=>p.pick&&p.pick.of===id?`<div class="pick">${who(p.pick.friend).name}'s pick</div>`:"";
  const body=(x,i)=>`<div class="orbiter" id="o${i}"><div class="body" data-id="${x.id}"><div class="glow" style="background:${x.col[0]}"></div><div class="ball" style="background:${grad(x.col)}"><div class="ini">${x.name[0]}</div><div class="nm">${x.name}</div><div class="ag">${x.age}</div></div>${pickTag(x.id)}</div></div>`;
  $("#system").innerHTML=`<svg class="tether" id="tether"></svg>
    <div class="ring" style="width:300px;height:300px"></div>
    <div class="ring" style="width:380px;height:380px;opacity:.5"></div>
    <div class="core"></div>${body(A,0)}${body(B,1)}`;
  document.querySelectorAll(".body").forEach(b=>b.onclick=e=>{if(!dragMoved)openProfile(b.dataset.id)});
  const w=who(wingman);
  const pk=p.pick?`<p><span style="color:var(--c)">● ${who(p.pick.friend).name}</span> already liked ${who(p.pick.of).name}${p.pick.friend!==wingman?` · <a href="#" id="flyWith" style="color:var(--c)">fly with ${who(p.pick.friend).name}</a>`:""}</p>`:`<p>None of your friends have weighed in yet</p>`;
  $("#pairMeta").innerHTML=`<h2>${A.name} &amp; ${B.name}</h2>${pk}<div class="tags">${[...A.tags.slice(0,2),...B.tags.slice(0,2)].map(t=>`<span class="tag">${t}</span>`).join("")}</div>`;
  const fw=$("#flyWith");if(fw)fw.onclick=e=>{e.preventDefault();wingman=p.pick.friend;renderChips();renderPair()};
  $("#counter").textContent=`pair ${pairIdx%PAIRS.length+1} of ${PAIRS.length} · you + ${w.name}`;
}
function orbit(){
  if(!paused)angle+=.006;
  const st=$("#stage");if(st&&st.offsetParent){
    const r=Math.min(st.clientWidth*.3,112);
    [0,1].forEach(i=>{const o=$("#o"+i);if(!o)return;const a=angle+i*Math.PI;
      const x=Math.cos(a)*r, y=Math.sin(a)*r*.38, z=Math.sin(a);
      o.style.transform=`translate(${x}px,${y}px) scale(${.82+.18*(z+1)/2})`;o.style.zIndex=z>0?3:1;
      o.firstElementChild.style.filter=`brightness(${.75+.25*(z+1)/2})`;});
    const t=$("#tether"),o0=$("#o0"),o1=$("#o1");
    if(t&&o0&&o1){const rs=t.getBoundingClientRect(),r0=o0.getBoundingClientRect(),r1=o1.getBoundingClientRect();
      t.innerHTML=`<line x1="${r0.left-rs.left}" y1="${r0.top-rs.top}" x2="${r1.left-rs.left}" y2="${r1.top-rs.top}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 5"/>`;}
  }
  requestAnimationFrame(orbit);
}

/* drag-to-swipe */
let sx=0,dx=0,drag=false,dragMoved=false;
const stage=$("#stage");
stage.addEventListener("pointerdown",e=>{drag=true;dragMoved=false;sx=e.clientX;dx=0});
addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-sx;if(Math.abs(dx)>6)dragMoved=true;
  $("#system").style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;
  $("#stLike").style.opacity=Math.max(0,dx/120);$("#stPass").style.opacity=Math.max(0,-dx/120)});
addEventListener("pointerup",()=>{if(!drag)return;drag=false;
  if(dx>110)swipe(true);else if(dx<-110)swipe(false);
  else{$("#system").style.transform="";$("#stLike").style.opacity=0;$("#stPass").style.opacity=0}});

function swipe(like){
  const sys=$("#system");sys.style.transform=`translateX(${like?500:-500}px) rotate(${like?20:-20}deg)`;sys.style.opacity=0;
  $("#stLike").style.opacity=like?1:0;$("#stPass").style.opacity=like?0:1;
  const p=PAIRS[pairIdx%PAIRS.length];
  setTimeout(()=>{
    $("#stLike").style.opacity=0;$("#stPass").style.opacity=0;
    if(like){
      // your wingman's pick (or auto) pairs with you
      const partnerForWing=p.pick&&p.pick.friend===wingman?p.pick.of:(p.pick?p.pick.of:p.b);
      const partnerForMe=partnerForWing===p.a?p.b:p.a;
      setDate([ME.id,wingman,partnerForMe,partnerForWing],p.spot,"pairs");
    }
    pairIdx++;sys.style.transition="none";sys.style.transform="translateX(0) scale(.6)";renderPair();
    requestAnimationFrame(()=>{sys.style.transition="";sys.style.transform="";sys.style.opacity=1});
  },320);
}
$("#yesBtn").onclick=()=>swipe(true);
$("#noBtn").onclick=()=>swipe(false);
$("#swapBtn").onclick=()=>{setMode("solo");toast("Showing friends of your friends' dates")};

/* ---------- profile sheet ---------- */
function openProfile(id,fromSolo){
  const x=PEOPLE[id];paused=true;
  const circ=(CIRCLES[id]||[]).map(f=>`<span class="chip" data-alt="${f}">${av(PEOPLE[f])}${PEOPLE[f].name}</span>`).join("");
  $("#sheet").innerHTML=`<div class="grab"></div><div style="display:flex;gap:12px;align-items:center">${av(x,"md")}<div><h3>${x.name}, ${x.age}</h3><p style="margin:0">${x.school}</p></div></div>
   <p>${x.bio}</p><div class="tags" style="justify-content:flex-start">${x.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
   <div class="prompt"><small>${x.prompt[0]}</small>${x.prompt[1]}</div>
   <p style="margin-top:14px">In ${x.name}'s universe</p><div class="chips">${circ}</div>
   <div class="alt" id="altDate">Like ${x.name} but not the pairing? Propose a different double date with one of her friends →</div>`;
  $("#sheet").classList.add("on");
  document.querySelectorAll("#sheet [data-alt]").forEach(c=>c.onclick=()=>{closeSheet();
    const f=c.dataset.alt;setDate([ME.id,wingman,id,f],"Proposed · time TBD","alt");});
  $("#altDate").onclick=()=>{closeSheet();soloIdx=Math.max(0,SOLO.indexOf((CIRCLES[id]||[])[0]));setMode("solo");scrollSolo()};
}
function closeSheet(){$("#sheet").classList.remove("on");paused=false}
$("#stage").addEventListener("click",e=>{if(!e.target.closest(".body"))closeSheet()});

/* ---------- individuals (friends of friends) ---------- */
function bestWingFor(id){ // match your friend to their friend
  const theirs=CIRCLES[id][0];const map={mia:"jake",grace:"dev",lily:"leo",ava:"leo",chloe:"dev",sofia:"jake",emma:"leo",nina:"jake"};
  return {theirs,mine:map[theirs]||"jake"};
}
function renderSolo(){
  $("#indiv").innerHTML=SOLO.map((id,i)=>{const x=PEOPLE[id],m=bestWingFor(id),t=PEOPLE[m.theirs],f=who(m.mine);
    return `<div class="slide" data-i="${i}">
      <div class="solo" data-id="${id}">
        <div class="streak l">${[0,1,2].map(k=>`<span style="top:${8+k*12}px;width:${60-k*14}px;right:0;animation-delay:${k*.3}s"></span>`).join("")}</div>
        <div class="streak r">${[0,1,2].map(k=>`<span style="top:${8+k*12}px;width:${60-k*14}px;left:0;animation-delay:${k*.3+.15}s"></span>`).join("")}</div>
        <div class="glow" style="background:${x.col[0]}"></div>
        <div class="ball" style="background:${grad(x.col)}"><div class="ini">${x.name[0]}</div><div style="font-weight:600">${x.name}, ${x.age}</div></div>
        <div class="moonwrap"><div class="moon" style="background:${grad(t.col)};animation-delay:-${i*1.5}s">${t.name[0]}</div></div>
      </div>
      <div class="meta"><p>${x.bio}</p><div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>
      <div class="ffcard">If you like ${x.name}, we line up:
        <div class="ffrow">${av(ME)} You <span class="plus">+</span> ${av(x)} ${x.name}</div>
        <div class="ffrow">${av(f)} ${f.name} <span class="plus">+</span> ${av(t)} ${t.name} <span style="margin-left:auto;font-size:11px;color:var(--dim)">her friend</span></div>
      </div>
    </div>`}).join("");
  $("#dots").innerHTML=SOLO.map((_,i)=>`<i class="${i===soloIdx?"on":""}"></i>`).join("");
  document.querySelectorAll(".solo").forEach(s=>s.onclick=()=>openProfile(s.dataset.id,true));
}
const indiv=$("#indiv");
indiv.addEventListener("scroll",()=>{const i=Math.round(indiv.scrollLeft/indiv.clientWidth);if(i!==soloIdx){soloIdx=i;document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i))}});
function scrollSolo(){indiv.scrollTo({left:soloIdx*indiv.clientWidth,behavior:"smooth"})}
$("#soloYes").onclick=()=>{const id=SOLO[soloIdx],m=bestWingFor(id);setDate([ME.id,m.mine,id,m.theirs],"Auto-matched · picking a time","solo");};
$("#soloNo").onclick=()=>{soloIdx=(soloIdx+1)%SOLO.length;scrollSolo()};

/* ---------- date setup ---------- */
function setDate(ids,spot,src){
  const [me,wing,her,friend]=ids.map(who);
  const d={id:Date.now(),ids,spot,src,msgs:[]};
  d.msgs=[
    {sys:`Wingman matched ${me.name} + ${her.name} and ${wing.name} + ${friend.name}`},
    {card:true},
    {from:friend.id,t:`omg hi 👋 ${her.name} has been talking about this all week`},
    {from:wing.id,t:`we're so in. ${spot.split("·")[0].trim()} works?`},
  ];
  dates.unshift(d);unseen++;updateBadge();
  // overlay
  const cv=$("#converge");const pos=[[0,0],[190,0],[0,150],[190,150]];
  cv.innerHTML=ids.map((id,i)=>{const p=who(id);return `<div class="planet" style="background:${grad(p.col)};left:${pos[i][0]}px;top:${pos[i][1]}px">${p.name[0]}</div>`}).join("");
  $("#matchSub").textContent=`You + ${her.name}  ·  ${wing.name} + ${friend.name}`;
  $("#steps").innerHTML=[`${wing.name} confirmed as your wingman`,`${friend.name} pulled in as ${her.name}'s plus-one`,"Group chat made","Everyone notified",`Suggested: ${spot}`].map(s=>`<div><span class="ck">✓</span>${s}</div>`).join("");
  $("#match").classList.add("on");
  requestAnimationFrame(()=>setTimeout(()=>{const els=cv.children;const c=[[60,45],[130,45],[60,105],[130,105]];[...els].forEach((e,i)=>{e.style.left=c[i][0]+"px";e.style.top=c[i][1]+"px"})},60));
  [...$("#steps").children].forEach((s,i)=>setTimeout(()=>s.classList.add("in"),500+i*280));
  $("#openChat").onclick=()=>{$("#match").classList.remove("on");openChat(d)};
}
$("#keepSwiping").onclick=()=>$("#match").classList.remove("on");
function updateBadge(){const b=$("#badge");b.textContent=unseen;b.style.display=unseen?"flex":"none"}

function renderDates(){
  unseen=0;updateBadge();
  if(!dates.length){$("#dateList").innerHTML=`<div class="empty">No double dates yet.<br>Swipe right on a pair, or like someone in Friends of friends,<br>and Wingman sets up the 2-on-2.</div>`;return}
  $("#dateList").innerHTML=dates.map(d=>{const n=d.ids.map(who);return `<div class="daterow" data-d="${d.id}"><div class="quad">${n.map(p=>av(p)).join("")}</div><div><b>${n[2].name} &amp; ${n[3].name}</b><small>with ${n[1].name} · ${d.spot}</small></div></div>`}).join("");
  document.querySelectorAll(".daterow").forEach(r=>r.onclick=()=>openChat(dates.find(d=>d.id==r.dataset.d)));
}

/* ---------- chat ---------- */
let curChat=null;
function openChat(d){curChat=d;const n=d.ids.map(who);
  $("#chatTitle").textContent=n.map(p=>p.name).join(", ");$("#chatSub").textContent=d.spot;
  $("#chatQuad").innerHTML=n.map(p=>av(p)).join("");renderMsgs();$("#chat").classList.add("on")}
function renderMsgs(){const d=curChat,n=d.ids.map(who);
  $("#msgs").innerHTML=d.msgs.map(m=>{
    if(m.sys)return `<div class="sys">${m.sys}</div>`;
    if(m.card)return `<div class="card"><b>🪐 Your double date</b>${d.spot}<br><span style="color:var(--dim)">Everyone's been notified. Tap to change time or place.</span></div>`;
    const p=who(m.from),mine=m.from===ME.id;
    return `<div class="m ${mine?"mine":""}">${mine?"":av(p)}<div>${mine?"":`<div class="who">${p.name}</div>`}<div class="bub">${m.t}</div></div></div>`}).join("");
  $("#msgs").scrollTop=1e6}
$("#compose").onsubmit=e=>{e.preventDefault();const v=$("#msgIn").value.trim();if(!v)return;curChat.msgs.push({from:ME.id,t:v});$("#msgIn").value="";renderMsgs();
  setTimeout(()=>{curChat.msgs.push({from:curChat.ids[2],t:["lol yes","can't wait 🪐","perfect, see you there"][Math.floor(Math.random()*3)]});renderMsgs()},900)};
$("#chatBack").onclick=()=>{$("#chat").classList.remove("on");if($("#v-dates").classList.contains("on"))renderDates()};

/* ---------- circle ---------- */
function renderCircle(){
  $("#circleView").innerHTML=`<div style="position:relative;height:300px;margin-top:10px">
     <div class="ring" style="width:240px;height:240px;top:50%;transform:translate(-50%,-50%)"></div>
     <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)">${av(ME,"md").replace('class="planet md"','class="planet md" style="width:70px;height:70px;font-size:24px;background:'+grad(ME.col)+'"')}</div>
     ${MY_FRIENDS.map((f,i)=>{const a=i/MY_FRIENDS.length*Math.PI*2-Math.PI/2;return `<div style="position:absolute;left:calc(50% + ${Math.cos(a)*120}px);top:calc(50% + ${Math.sin(a)*120}px);transform:translate(-50%,-50%);text-align:center">${av(f,"md")}<div style="font-size:11px;margin-top:4px">${f.name}</div></div>`}).join("")}
   </div>
   <div class="meta"><h2>Your universe</h2><p>The friends you'd go on a double date with. Wingman auto-pairs you with one of them on every match.</p></div>
   <div class="ffcard" style="margin-top:18px">${MY_FRIENDS.map(f=>`<div class="ffrow">${av(f)} ${f.name}<span style="margin-left:auto;font-size:11px;color:var(--dim)">${f.bio}</span></div>`).join("")}
   <div class="ffrow" style="color:var(--c);cursor:pointer" onclick="toast('Invite link copied (prototype)')">＋ Invite a friend to your universe</div></div>`;
}

/* ---------- nav ---------- */
function setMode(m){document.querySelectorAll(".modes button").forEach(b=>b.classList.toggle("on",b.dataset.mode===m));
  $("#m-pairs").classList.toggle("on",m==="pairs");$("#m-solo").classList.toggle("on",m==="solo");closeSheet();
  if(m==="solo")setTimeout(scrollSolo,30)}
document.querySelectorAll(".modes button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["explore","dates","circle"].forEach(t=>$("#v-"+t).classList.toggle("on",t===b.dataset.tab));closeSheet();
  if(b.dataset.tab==="dates")renderDates();if(b.dataset.tab==="circle")renderCircle();});

renderChips();renderPair();renderSolo();orbit();
</script>
</body>
</html>
